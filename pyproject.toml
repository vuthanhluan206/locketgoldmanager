[project]
name = "locket-gold-manager"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pymongo>=4.13,<5",
    "pydantic-settings>=2.5,<3",
    "cryptography>=43",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0"
]

[tool.vercel]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
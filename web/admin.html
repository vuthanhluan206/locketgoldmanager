<section class="card" aria-labelledby="adminTitle"><h2 id="adminTitle">Quản trị cấp phép</h2>
<p class="muted">Thêm ID mới hoặc nhập lại ID để cập nhật ngày hết hạn. Thời gian nhập theo múi giờ trên thiết bị.</p>
<form id="accountForm"><label>Locket ID<input id="accountId" required maxlength="128" pattern="[A-Za-z0-9_$:@.\-]+" autocomplete="off"></label>
<label>Ngày hết hạn<input id="expiry" type="datetime-local" required></label><button id="save">Lưu tài khoản</button> <button class="secondary" id="logout" type="button">Thoát</button></form>
<p id="adminMessage" role="status" aria-live="polite"></p>
<div class="scroll"><table><thead><tr><th>ID</th><th>Hết hạn</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody id="accounts"></tbody></table></div>
<p><button id="previous" class="secondary">Trang trước</button> <button id="next" class="secondary">Trang sau</button></p></section>
<script>
(()=>{
 // Keep the secret in memory only. Remove it from the current browser history entry.
 let token=new URLSearchParams(location.search).get('admin');history.replaceState(null,'',location.pathname);
 let skip=0;const limit=50;const message=document.getElementById('adminMessage');
 async function api(path,options={}){const r=await fetch(path,{...options,headers:{'Content-Type':'application/json','Authorization':'Bearer '+token}});if(!r.ok){let e;try{e=await r.json();}catch{}throw Error(typeof e?.detail==='string'?e.detail:('Yêu cầu thất bại ('+r.status+'). Kiểm tra dữ liệu và token.'));}return r.status===204?null:r.json();}
 async function load(){try{const rows=await api('/admin/accounts?skip='+skip+'&limit='+limit);const body=document.getElementById('accounts');body.replaceChildren();for(const row of rows){const tr=document.createElement('tr');for(const value of [row.locket_id,new Date(row.expires_date).toLocaleString(),new Date(row.expires_date)>new Date()?'Gold':'Hết hạn']){const td=document.createElement('td');td.textContent=value;tr.append(td);}const td=document.createElement('td');const edit=document.createElement('button');edit.textContent='Sửa';edit.className='secondary';edit.onclick=()=>{document.getElementById('accountId').value=row.locket_id;const date=new Date(row.expires_date);document.getElementById('expiry').value=new Date(date-date.getTimezoneOffset()*60000).toISOString().slice(0,16);};const del=document.createElement('button');del.textContent='Xóa';del.onclick=async()=>{if(!confirm('Xóa tài khoản '+row.locket_id+'?'))return;del.disabled=true;try{await api('/admin/accounts/'+encodeURIComponent(row.locket_id),{method:'DELETE'});await load();}catch(e){message.textContent=e.message;}finally{del.disabled=false;}};td.append(edit,' ',del);tr.append(td);body.append(tr);}document.getElementById('previous').disabled=skip===0;document.getElementById('next').disabled=rows.length<limit;}catch(e){message.textContent=e.message;}}
 document.getElementById('accountForm').onsubmit=async e=>{e.preventDefault();const save=document.getElementById('save');save.disabled=true;try{await api('/admin/add-account',{method:'POST',body:JSON.stringify({locket_id:document.getElementById('accountId').value,expires_date:new Date(document.getElementById('expiry').value).toISOString()})});message.textContent='Đã lưu tài khoản.';await load();}catch(e){message.textContent=e.message;}finally{save.disabled=false;}};
 document.getElementById('previous').onclick=()=>{skip=Math.max(0,skip-limit);load();};document.getElementById('next').onclick=()=>{skip+=limit;load();};document.getElementById('logout').onclick=()=>{token=null;location.replace('/');};load();
})();
</script>

<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer"><title>DNS Manager</title>
<style nonce="__NONCE__">
:root{font-family:system-ui,-apple-system,sans-serif;color:#14243b;background:#f4f7fb}*{box-sizing:border-box}
main{max-width:900px;margin:35px auto;padding:0 16px}h1{font-size:28px}
section{background:white;border:1px solid #e2e7f0;border-radius:15px;padding:22px;margin:16px 0}
label{display:block;margin:12px 0 4px}input,textarea,button{font:inherit;border-radius:8px;padding:11px;border:1px solid #bac5d6}
input,textarea{display:block;width:100%}button{background:#234b85;color:white;cursor:pointer;margin:7px 6px 7px 0}
button:disabled{opacity:.5}pre{white-space:pre-wrap;word-break:break-word;background:#edf3f9;padding:14px;border-radius:8px}
table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #ddd;padding:10px;text-align:left}
a{color:#205a9a}small{color:#58677d}#status{font-weight:600}
</style></head><body><main><h1>Managed DNS</h1>
<p>Tạo Locket ID quản lý và link DNS chỉ bằng một thao tác. Thời hạn ở đây chỉ áp dụng cho dịch vụ DNS, không cấp quyền Locket Gold.  <a href="/admin-gmnWJ5nG3qZRcdku3eBtkIka">Trang quản trị chính</a></p>
<section><h2>Tạo ID + Link DNS</h2><form id="deviceForm">
<label>Tên thiết bị<input id="label" maxlength="80" required placeholder="iPhone 15"></label>
<label>Locket ID <input id="locketId" maxlength="128" required pattern="[A-Za-z0-9_$:@.\\-]+" placeholder="Locket ID"></label>
<label>Hết hạn (giờ trên thiết bị)<input id="expiry" type="datetime-local" required></label>
<label>Chặn tên miền (mỗi dòng một tên miền)<textarea id="domains" rows="4" placeholder="ads.example.com"></textarea></label>
<button id="create">Tạo ID &amp; lấy link DNS</button></form>
<p id="status" role="status"></p><div id="result" hidden><p><strong>Liên kết cấu hình riêng (chỉ hiện một lần):</strong></p>
<pre id="url"></pre><a id="download" href="#">Tải .mobileconfig</a></div></section>
<section><h2>Thiết bị</h2><button id="refresh" type="button">Làm mới</button>
<div style="overflow:auto"><table><thead><tr><th>Tên</th><th>Locket ID</th><th>Hết hạn</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody id="rows"></tbody></table></div></section>
</main><script nonce="__NONCE__">
(()=>{
const $=id=>document.getElementById(id);
const raw=localStorage.getItem('locket_admin_session');
let session;try{session=JSON.parse(raw||'null')}catch{}
if(!session?.access_token){$('status').textContent='Hãy đăng nhập vào trang quản trị trước khi dùng công cụ này.';return}
async function api(path,options={}){
const res=await fetch(path,{...options,cache:'no-store',credentials:'omit',
headers:{'Authorization':'Bearer '+session.access_token,'Content-Type':'application/json',...(options.headers||{})}});
if(!res.ok)throw new Error('HTTP '+res.status+': '+(await res.text()).slice(0,180));
if(res.status===204)return null;return await res.json()
}
async function refresh(){
const list=await api('/api/admin/dns/devices');$('rows').replaceChildren();
for(const d of list){
const tr=document.createElement('tr');
for(const val of [d.label,d.locket_id||"—",new Date(d.expires_at).toLocaleString(),d.enabled?'Đang bật':'Đã thu hồi']){
const td=document.createElement('td');td.textContent=val;tr.appendChild(td)}
const td=document.createElement('td');
const renew=document.createElement('button');renew.textContent='Gia hạn 30 ngày';renew.disabled=!d.enabled;
renew.onclick=async()=>{try{
await api('/api/admin/dns/devices/'+d.id+'/renew',{method:'POST',body:JSON.stringify({days:30})});
$('status').textContent='Đã gia hạn DNS và thời hạn tài khoản liên kết (nếu có). Không cần tải lại file.';
await refresh()
}catch(e){$('status').textContent=e.message}};
td.appendChild(renew);
const b=document.createElement('button');b.textContent='Thu hồi';b.disabled=!d.enabled;
b.onclick=async()=>{if(!confirm('Thu hồi thiết bị này?'))return;try{await api('/api/admin/dns/devices/'+d.id+'/revoke',{method:'POST'});await refresh()}catch(e){$('status').textContent=e.message}};
td.appendChild(b);tr.appendChild(td);$('rows').appendChild(tr)
}}
$('refresh').onclick=()=>refresh().catch(e=>$('status').textContent=e.message);
$('deviceForm').onsubmit=async e=>{
e.preventDefault();$('create').disabled=true;$('result').hidden=true;$('status').textContent='Đang tạo...';
try{
const expiry=new Date($('expiry').value);
if(Number.isNaN(expiry.getTime()))throw Error('Ngày hết hạn không hợp lệ');
const d=await api('/api/admin/dns/devices/linked',{method:'POST',body:JSON.stringify({
label:$('label').value,locket_id:$('locketId').value.trim()||null,expires_at:expiry.toISOString(),
block_domains:$('domains').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean)})});
const url=new URL(d.profile_download_url,location.origin).href;
$('url').textContent=url;$('download').href=url;$('result').hidden=false;
$('status').textContent='Đã tạo. Đã tạo hoặc cập nhật ID quản lý và link DNS. Lưu liên kết ngay: token sẽ không được hiển thị lại.';
await refresh()
}catch(e){$('status').textContent=e.message}
finally{$('create').disabled=false}
};
refresh().catch(e=>$('status').textContent=e.message)
})()
</script></body></html>
